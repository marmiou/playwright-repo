name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: 0 · Check if eval files changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      evals: ${{ steps.filter.outputs.evals }}
    steps:
      - name: Detect evaluation changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            evals:
              - 'evals/**'
              - '.claude/skills/**'
              - '.github/workflows/playwright.yml'

  lint:
    name: 1 · Lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js and Yarn
        uses: ./.github/actions/setup

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run ESLint
        run: yarn lint

      - name: Run TypeScript checks
        run: yarn typecheck

  evals-unit:
    name: 2 · Test the eval validator
    needs: changes
    if: needs.changes.outputs.evals == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: evals/requirements.txt

      - name: Install validator dependency
        run: python -m pip install -r evals/requirements.txt

      - name: Run validator unit tests
        run: python -m unittest discover -s evals/tests -v

  evals-dataset:
    name: 3 · Validate eval cases
    needs: changes
    if: needs.changes.outputs.evals == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: evals/requirements.txt

      - name: Install validator dependency
        run: python -m pip install -r evals/requirements.txt

      - name: Validate evaluation case dataset
        run: python evals/validate_cases.py --results-file eval-validation-results/results.json

      - name: Upload validator results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-validation-results
          path: eval-validation-results/results.json
          retention-days: 14
          if-no-files-found: ignore

  tests:
    name: 4 · Run Playwright tests
    needs: [lint, evals-unit, evals-dataset]
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js and Yarn
        uses: ./.github/actions/setup

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install Playwright browsers
        run: yarn playwright install --with-deps

      - name: Install Allure CLI
        id: install_allure
        run: npm install --global allure-commandline

      - name: Run Playwright tests
        id: playwright
        run: yarn playwright test --reporter=line,github,allure-playwright,html,json
        env:
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/results.json

      - name: Generate Allure report
        if: always() && steps.install_allure.outcome == 'success' && hashFiles('allure-results/**') != ''
        run: allure generate allure-results --clean -o allure-report

      - name: Upload Playwright JSON results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-json-results
          path: test-results/results.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: allure-report/
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    name: 5 · Publish Allure report
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Download Allure report
        uses: actions/download-artifact@v7
        with:
          name: allure-report
          path: allure-report

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report

  summary:
    name: 6 · Pipeline summary
    needs: [changes, lint, evals-unit, evals-dataset, tests, deploy]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download validator results
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: eval-validation-results
          path: failure-data/evals

      - name: Download Playwright JSON results
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: playwright-json-results
          path: failure-data/playwright

      - name: Write pipeline summary
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          EVALS_CHANGED: ${{ needs.changes.outputs.evals }}
          LINT_RESULT: ${{ needs.lint.result }}
          UNIT_RESULT: ${{ needs.evals-unit.result }}
          DATASET_RESULT: ${{ needs.evals-dataset.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          statuses = [
              ("0", "Check if eval files changed", os.environ["CHANGES_RESULT"], ""),
              ("1", "Lint and type check", os.environ["LINT_RESULT"], ""),
              ("2", "Test the eval validator", os.environ["UNIT_RESULT"], ""),
              ("3", "Validate eval cases", os.environ["DATASET_RESULT"], ""),
              ("4", "Run Playwright tests", os.environ["TESTS_RESULT"], ""),
              ("5", "Publish Allure report", os.environ["DEPLOY_RESULT"], ""),
          ]

          def safe_text(value, limit=500):
              text = str(value or "").replace("\\", "\\\\").replace("\r", " ").replace("\n", " ")
              for character in ("`", "*", "_", "[", "]", "(", ")", "|"):
                  text = text.replace(character, "\\" + character)
              return text.replace("<", "&lt;").replace(">", "&gt;").replace("@", "@\u200b")[:limit]

          def result_label(result):
              return {
                  "success": "✅ PASS",
                  "failure": "❌ FAIL",
                  "skipped": "⏭️ SKIPPED",
                  "cancelled": "🚫 CANCELLED",
              }.get(result, f"⚪ {result.upper()}")

          notes = {}
          if os.environ["CHANGES_RESULT"] != "success":
              notes["2"] = "Change detection did not complete"
              notes["3"] = "Change detection did not complete"
          elif os.environ["EVALS_CHANGED"] != "true":
              notes["2"] = "No eval files changed"
              notes["3"] = "No eval files changed"
          if os.environ["TESTS_RESULT"] == "skipped":
              notes["4"] = "Blocked by an earlier failure"
          if os.environ.get("GITHUB_REF") != "refs/heads/main" or os.environ.get("GITHUB_EVENT_NAME") != "push":
              notes["5"] = "Runs on main only"
          elif os.environ["TESTS_RESULT"] != "success":
              notes["5"] = "Blocked by an earlier failure"

          lines = [
              "## CI pipeline",
              "",
              "| # | Step | Result | Note |",
              "|---:|---|---|---|",
          ]
          for number, name, result, _ in statuses:
              note = notes.get(number, "")
              if number in {"2", "3"} and result == "skipped" and not note:
                  note = "Blocked by an earlier failure"
              lines.append(f"| {number} | {name} | {result_label(result)} | {note} |")

          summary_result = (
              "failure"
              if any(result in {"failure", "cancelled"} for _, _, result, _ in statuses)
              else "success"
          )
          lines.append(
              f"| 6 | Pipeline summary | {result_label(summary_result)} | Aggregate required check |"
          )

          lines.extend(["", "## Failures", ""])
          failures = []
          eval_path = Path("failure-data/evals/results.json")
          if eval_path.is_file():
              try:
                  payload = json.loads(eval_path.read_text(encoding="utf-8"))
                  for item in payload.get("failures", []):
                      failures.append(
                          f"- **Validator · {safe_text(item.get('case_id') or 'dataset')}** "
                          f"({safe_text(item.get('file') or 'unknown file')}): "
                          f"{safe_text(item.get('message', 'No message'))}"
                      )
              except (OSError, json.JSONDecodeError):
                  failures.append("- Validator results JSON could not be parsed.")

          playwright_path = Path("failure-data/playwright/results.json")
          if playwright_path.is_file():
              try:
                  payload = json.loads(playwright_path.read_text(encoding="utf-8"))
                  def visit(suites):
                      for suite in suites or []:
                          for spec in suite.get("specs", []):
                              for test in spec.get("tests", []):
                                  results = test.get("results", [])
                                  if not results:
                                      continue
                                  result = results[-1]
                                  if result.get("status") in {"failed", "timedOut", "interrupted"}:
                                      title = " › ".join(
                                          part for part in [suite.get("title"), spec.get("title")] if part
                                      )
                                      error = result.get("error")
                                      message = (
                                          error.get("message", result.get("status"))
                                          if isinstance(error, dict)
                                          else str(error or result.get("status"))
                                      )
                                      failures.append(
                                          f"- **Playwright · {safe_text(title or spec.get('file', 'test'))}**: {safe_text(message)}"
                                      )
                          visit(suite.get("suites", []))
                  visit(payload.get("suites", []))
              except (OSError, json.JSONDecodeError):
                  failures.append("- Playwright results JSON could not be parsed.")

          if failures:
              lines.extend(failures[:50])
              if len(failures) > 50:
                  lines.append(f"- … {len(failures) - 50} additional failure(s) omitted.")
          else:
              lines.append("No detailed failure records were available.")

          summary = "\n".join(lines) + "\n"
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(summary, encoding="utf-8")
          print(summary)

          if any(result in {"failure", "cancelled"} for _, _, result, _ in statuses):
              raise SystemExit(1)
          PY
