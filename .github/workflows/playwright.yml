
name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Default permissions are read-only.
permissions:
  contents: read

# Cancel outdated runs on the same branch.
concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Quality Checks and Playwright Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack and activate Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.18.1 --activate
          yarn --version

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run ESLint
        run: yarn lint

      - name: Run TypeScript checks
        run: yarn typecheck

      - name: Install Playwright browsers
        run: yarn playwright install --with-deps

      - name: Install Allure CLI
        id: install_allure
        run: npm install --global allure-commandline

      - name: Run Playwright tests
        run: yarn playwright test --reporter=line,allure-playwright,html
        env:
          PLAYWRIGHT_HTML_OPEN: never

      - name: Generate Allure report
        if: always() && steps.install_allure.outcome == 'success' && hashFiles('allure-results/**') != ''
        run: allure generate allure-results --clean -o allure-report

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: allure-report/
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    name: Deploy Allure report
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Download Allure report
        uses: actions/download-artifact@v7
        with:
          name: allure-report
          path: allure-report

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
