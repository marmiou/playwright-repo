name: QE Evaluation Dataset Validation

on:
  push:
    paths:
      - "evals/**"
      - ".claude/skills/**"
      - ".github/workflows/evals-validation.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "evals/**"
      - ".claude/skills/**"
      - ".github/workflows/evals-validation.yml"

permissions:
  contents: read

concurrency:
  group: evals-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-cases:
    name: Tier 1 Case Dataset Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: evals/requirements.txt

      - name: Install validator dependency
        run: python -m pip install -r evals/requirements.txt

      - name: Run validator unit tests
        run: python -m unittest discover -s evals/tests -v

      - name: Validate evaluation case dataset
        run: python evals/validate_cases.py
