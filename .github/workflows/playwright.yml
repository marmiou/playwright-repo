name: Application & AI QE Framework CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: 0 · Detect AI QE Framework Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      evals: ${{ steps.filter.outputs.evals }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Detect evaluation changes
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.3
        id: filter
        with:
          filters: |
            evals:
              - 'evals/**'
              - '.claude/skills/**'
              - '.github/workflows/playwright.yml'

  ci-policy:
    name: 0a · CI Policy — Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Test CI status policy
        run: python -m unittest discover -s scripts/tests -p 'test_ci_status.py' -v

  evals-unit:
    name: 1 · AI QE Framework — Validator Unit Tests
    needs: changes
    if: needs.changes.outputs.evals == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: evals/requirements.txt

      - name: Install validator dependency
        run: python -m pip install -r evals/requirements.txt

      - name: Run validator unit tests
        run: python -m unittest discover -s evals/tests -v

  evals-dataset:
    name: 2 · AI QE Framework — Validate Evaluation Cases
    needs: changes
    if: needs.changes.outputs.evals == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: evals/requirements.txt

      - name: Install validator dependency
        run: python -m pip install -r evals/requirements.txt

      - name: Validate evaluation case dataset
        run: python evals/validate_cases.py --results-file eval-validation-results/results.json

      - name: Upload validator results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: eval-validation-results
          path: eval-validation-results/results.json
          retention-days: 14
          if-no-files-found: ignore

  evals-results:
    name: 3 · AI QE Framework — Validate Evaluation Results
    needs: changes
    if: needs.changes.outputs.evals == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: evals/requirements.txt

      - name: Install validator dependency
        run: python -m pip install -r evals/requirements.txt

      - name: Validate evaluation result records
        run: python evals/validate_results.py --results-file eval-results-validation/results.json

      - name: Upload result validation
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: eval-results-validation
          path: eval-results-validation/results.json
          retention-days: 14
          if-no-files-found: ignore

  lint:
    name: 4 · Application — Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js and Yarn
        uses: ./.github/actions/setup

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run ESLint
        run: yarn lint


  typecheck:
    name: 5 · Application — Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js and Yarn
        uses: ./.github/actions/setup

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run TypeScript checks
        run: yarn typecheck

  tests:
    name: 6 · Application — Playwright Tests
    needs: [changes, ci-policy, lint, typecheck, evals-unit, evals-dataset, evals-results]
    if: >-
      always() &&
      needs.changes.result == 'success' &&
      needs.ci-policy.result == 'success' &&
      needs.lint.result == 'success' &&
      needs.typecheck.result == 'success' &&
      (needs.evals-unit.result == 'success' || (needs.evals-unit.result == 'skipped' && needs.changes.outputs.evals != 'true')) &&
      (needs.evals-dataset.result == 'success' || (needs.evals-dataset.result == 'skipped' && needs.changes.outputs.evals != 'true')) &&
      (needs.evals-results.result == 'success' || (needs.evals-results.result == 'skipped' && needs.changes.outputs.evals != 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js and Yarn
        uses: ./.github/actions/setup

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install Playwright browsers
        run: yarn playwright install --with-deps

      - name: Install Allure CLI
        id: install_allure
        run: npm install --global allure-commandline@2.46.1

      - name: Run Playwright tests
        id: playwright
        run: yarn playwright test --reporter=line,github,allure-playwright,html,json
        env:
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/results.json

      - name: Generate Allure report
        if: always() && steps.install_allure.outcome == 'success' && hashFiles('allure-results/**') != ''
        run: allure generate allure-results --clean -o allure-report

      - name: Upload Playwright JSON results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-json-results
          path: test-results/results.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: allure-report
          path: allure-report/
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    name: 7 · Application — Deploy Allure Report to GitHub Pages
    needs: tests
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Download Allure report
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: allure-report
          path: allure-report

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report

  summary:
    name: 8 · CI Summary
    needs: [changes, ci-policy, lint, typecheck, evals-unit, evals-dataset, evals-results, tests, deploy]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Download validator results
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: eval-validation-results
          path: failure-data/evals

      - name: Download evaluation result validation
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: eval-results-validation
          path: failure-data/eval-results

      - name: Download Playwright JSON results
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: playwright-json-results
          path: failure-data/playwright

      - name: Write pipeline summary
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CI_POLICY_RESULT: ${{ needs.ci-policy.result }}
          EVALS_CHANGED: ${{ needs.changes.outputs.evals }}
          LINT_RESULT: ${{ needs.lint.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          UNIT_RESULT: ${{ needs.evals-unit.result }}
          DATASET_RESULT: ${{ needs.evals-dataset.result }}
          RESULTS_RESULT: ${{ needs.evals-results.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          statuses = [
              ("0", "Detect AI QE Framework Changes", os.environ["CHANGES_RESULT"], ""),
              ("0a", "CI Policy — Unit Tests", os.environ["CI_POLICY_RESULT"], ""),
              ("1", "AI QE Framework — Validator Unit Tests", os.environ["UNIT_RESULT"], ""),
              ("2", "AI QE Framework — Validate Evaluation Cases", os.environ["DATASET_RESULT"], ""),
              ("3", "AI QE Framework — Validate Evaluation Results", os.environ["RESULTS_RESULT"], ""),
              ("4", "Application — Lint", os.environ["LINT_RESULT"], ""),
              ("5", "Application — Type Check", os.environ["TYPECHECK_RESULT"], ""),
              ("6", "Application — Playwright Tests", os.environ["TESTS_RESULT"], ""),
              ("7", "Application — Deploy Allure Report to GitHub Pages", os.environ["DEPLOY_RESULT"], ""),
          ]

          def safe_text(value, limit=500):
              text = str(value or "").replace("\\", "\\\\").replace("\r", " ").replace("\n", " ")
              for character in ("`", "*", "_", "[", "]", "(", ")", "|"):
                  text = text.replace(character, "\\" + character)
              return text.replace("<", "&lt;").replace(">", "&gt;").replace("@", "@\u200b")[:limit]

          def result_label(result):
              return {
                  "success": "✅ PASS",
                  "failure": "❌ FAIL",
                  "skipped": "⏭️ SKIPPED",
                  "cancelled": "🚫 CANCELLED",
              }.get(result, f"⚪ {result.upper()}")

          notes = {}
          if os.environ["CHANGES_RESULT"] != "success":
              notes["1"] = "Change detection did not complete"
              notes["2"] = "Change detection did not complete"
              notes["3"] = "Change detection did not complete"
          elif os.environ["EVALS_CHANGED"] != "true":
              notes["1"] = "No eval files changed"
              notes["2"] = "No eval files changed"
              notes["3"] = "No eval files changed"
          if os.environ["TESTS_RESULT"] == "skipped":
              notes["6"] = "Unexpected skip: application tests are required"
          for number, result in (("1", os.environ["UNIT_RESULT"]), ("2", os.environ["DATASET_RESULT"]), ("3", os.environ["RESULTS_RESULT"])):
              if result == "skipped" and os.environ["EVALS_CHANGED"] == "true":
                  notes[number] = "Unexpected skip: evaluation files changed"
          if os.environ.get("GITHUB_REF") != "refs/heads/main" or os.environ.get("GITHUB_EVENT_NAME") != "push":
              notes["7"] = "Runs on main only"
          elif os.environ["TESTS_RESULT"] != "success":
              notes["7"] = "Blocked by an earlier failure"

          lines = [
              "## CI pipeline",
              "",
              "| # | Step | Result | Note |",
              "|---:|---|---|---|",
          ]
          for number, name, result, _ in statuses:
              note = notes.get(number, "")
              if number in {"1", "2", "3"} and result == "skipped" and not note:
                  note = "Blocked by an earlier failure"
              lines.append(f"| {number} | {name} | {result_label(result)} | {note} |")

          import sys
          sys.path.insert(0, "scripts")
          from ci_status import status_is_acceptable

          evals_changed = os.environ["EVALS_CHANGED"] == "true"
          is_main_push = (
              os.environ.get("GITHUB_REF") == "refs/heads/main"
              and os.environ.get("GITHUB_EVENT_NAME") == "push"
          )
          invalid_statuses = [
              (number, name, result)
              for number, name, result, _ in statuses
              if not status_is_acceptable(
                  number,
                  result,
                  evals_changed=evals_changed,
                  is_main_push=is_main_push,
                  tests_result=os.environ["TESTS_RESULT"],
              )
          ]
          summary_result = "failure" if invalid_statuses else "success"
          lines.append(
              f"| 8 | CI summary | {result_label(summary_result)} | Aggregate required check |"
          )

          lines.extend(["", "## Failures", ""])
          failures = []
          eval_path = Path("failure-data/evals/results.json")
          if eval_path.is_file():
              try:
                  payload = json.loads(eval_path.read_text(encoding="utf-8"))
                  for item in payload.get("failures", []):
                      failures.append(
                          f"- **Validator · {safe_text(item.get('case_id') or 'dataset')}** "
                          f"({safe_text(item.get('file') or 'unknown file')}): "
                          f"{safe_text(item.get('message', 'No message'))}"
                      )
              except (OSError, json.JSONDecodeError):
                  failures.append("- Validator results JSON could not be parsed.")

          result_validation_path = Path("failure-data/eval-results/results.json")
          if result_validation_path.is_file():
              try:
                  payload = json.loads(result_validation_path.read_text(encoding="utf-8"))
                  for item in payload.get("failures", []):
                      failures.append(
                          f"- **AI QE Result Validator · {safe_text(item.get('file') or 'result')}** "
                          f"({safe_text(item.get('rule') or 'integrity')}): "
                          f"{safe_text(item.get('message', 'No message'))}"
                      )
              except (OSError, json.JSONDecodeError):
                  failures.append("- Evaluation result validation JSON could not be parsed.")

          playwright_path = Path("failure-data/playwright/results.json")
          if playwright_path.is_file():
              try:
                  payload = json.loads(playwright_path.read_text(encoding="utf-8"))
                  def visit(suites):
                      for suite in suites or []:
                          for spec in suite.get("specs", []):
                              for test in spec.get("tests", []):
                                  results = test.get("results", [])
                                  if not results:
                                      continue
                                  result = results[-1]
                                  if result.get("status") in {"failed", "timedOut", "interrupted"}:
                                      title = " › ".join(
                                          part for part in [suite.get("title"), spec.get("title")] if part
                                      )
                                      error = result.get("error")
                                      message = (
                                          error.get("message", result.get("status"))
                                          if isinstance(error, dict)
                                          else str(error or result.get("status"))
                                      )
                                      failures.append(
                                          f"- **Playwright · {safe_text(title or spec.get('file', 'test'))}**: {safe_text(message)}"
                                      )
                          visit(suite.get("suites", []))
                  visit(payload.get("suites", []))
              except (OSError, json.JSONDecodeError):
                  failures.append("- Playwright results JSON could not be parsed.")

          if failures:
              lines.extend(failures[:50])
              if len(failures) > 50:
                  lines.append(f"- … {len(failures) - 50} additional failure(s) omitted.")
          else:
              lines.append("No detailed failure records were available.")

          summary = "\n".join(lines) + "\n"
          if len(summary) > 20000:
              summary = summary[:19500] + "\n\n_Summary truncated to 20,000 characters._\n"
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(summary, encoding="utf-8")
          print(summary)

          if invalid_statuses:
              for number, name, result in invalid_statuses:
                  print(f"Unexpected CI status for step {number} ({name}): {result}", file=sys.stderr)
              raise SystemExit(1)
          PY
